random_seed: 42
use_sample_data: true

enable_llm: true         

data:
  path: "data/Synthetic_fb_ads.csv"

thresholds:
  roas_drop_pct: 0.25
  ctr_drop_pct: 0.20
  min_impressions: 1000

retry:
  attempts: 4
  delay: 5.0


llm:
  provider: "ollama"
  model: "llama3"
  temperature: 0.2
  max_tokens: 2048

paths:
  report_dir: "reports"
  log_dir: "logs"
