# Project file: config/config.yml

paths:
  log_dir: "logs"
  report_dir: "reports"
  metrics_dir: logs/metrics

data:
  path: "data/Synthetic_fb_ads.csv"

llm:
  enable_llm: true
  model: llama3.1
  temperature: 0.1
  format: json


schema:
  expected_columns:
    - date
    - campaign_name
    - adset_name
    - spend
    - impressions
    - clicks
    - purchases
    - revenue
  strict: false
  drift_threshold: 0.25
  baseline_path: "schema/baseline.json"


thresholds:
  min_impressions: 100
  roas_drop_pct: 0.25
  ctr_drop_pct: 0.20

retry:
  attempts: 3
  delay: 1.0
